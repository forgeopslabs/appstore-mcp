[package]
name = "appstore-mcp"
version = "0.4.0"
edition = "2021"
# Verified against the locked dependency graph, not assumed: `darling` and
# `time` are the binding constraint. The `msrv` CI job builds on exactly this.
rust-version = "1.88"
description = "MCP server exposing the Apple App Store Connect API (126 tools)"
license = "MIT"
repository = "https://github.com/forgeopslabs/appstore-mcp"
homepage = "https://github.com/forgeopslabs/appstore-mcp"
documentation = "https://github.com/forgeopslabs/appstore-mcp/blob/main/docs/TOOLS.md"
readme = "README.md"
keywords = ["mcp", "app-store-connect", "apple", "appstore", "testflight"]
categories = ["command-line-utilities", "api-bindings", "development-tools"]

[profile.release]
strip = true
# Whole-program LTO in a single codegen unit: 8.15 MB -> 6.05 MB (-25.8%). It
# costs ~42s on a full release build, which only ever runs in the release
# workflow (and in parallel across the three platforms), while the binary ships
# three times over inside every .mcpb bundle. Debug and test builds are
# untouched, so day-to-day compile times don't change.
lto = "fat"
codegen-units = 1
# Deliberately NOT `panic = "abort"`: it would shrink the binary further, but a
# panic in one tool handler would take the whole server down instead of failing
# that single call, and an MCP client on stdio would lose its session.
[dependencies]
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
    "sync",
    "fs",
    "time",
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
thiserror = "2"
anyhow = "1"
md-5 = "0.10"
hex = "0.4"
# Reference-counted buffers: upload chunks and downloaded report segments are
# handed between retry attempts and threads without copying the payload.
bytes = "1"
# Pure-Rust backend: the release workflow cross-compiles, and a C dependency
# would need a working cross-toolchain on every target.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
csv = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
